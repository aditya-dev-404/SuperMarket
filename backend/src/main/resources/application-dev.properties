spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/supermarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:supermarket}
spring.datasource.password=${DB_PASSWORD:supermarket}

spring.jpa.show-sql=false

# Dev-only signing key (>= 32 chars). Override with JWT_SECRET. Never reuse in production.
app.jwt.secret=${JWT_SECRET:dev-only-signing-key-change-me-0123456789-changed-By-me}
# The dev server runs over plain http
app.auth.refresh-cookie.secure=false

logging.level.com.aditya.supermarket=DEBUG
