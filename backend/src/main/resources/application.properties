spring.application.name=supermarket-backend
spring.profiles.default=dev

# JPA / Hibernate: schema is owned by Flyway, Hibernate only validates it
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# API docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS (comma-separated list of allowed frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT / authentication (secret is supplied per profile, never committed for prod)
app.jwt.issuer=https://api.supermarket.local
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# Refresh token cookie
app.auth.refresh-cookie.name=refresh_token
app.auth.refresh-cookie.path=/api/v1/auth
app.auth.refresh-cookie.same-site=Strict
app.auth.refresh-cookie.secure=true

# Optional first admin account, created on startup if it does not exist yet
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- Mail (Phase 7) ----
# Defaults point at Mailpit from docker-compose (SMTP localhost:1025, inbox UI http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- Notifications (Phase 7) ----
app.notification.enabled=true
app.notification.from-address=${MAIL_FROM:no-reply@supermarket.local}
app.notification.from-name=superMarket
app.notification.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.notification.max-attempts=3
app.notification.retry-delay=PT2M
app.notification.retry-interval=PT1M
app.notification.retry-batch-size=20

# ---- Cloudinary ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=supermarket/products
